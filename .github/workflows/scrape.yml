# Pulls fresh stories every 2 hours so readers see new articles on each visit.
# Vercel Hobby crons only run once a day (see vercel.json, which still sends
# the 7 AM digest); this workflow fills the gaps by calling the same endpoint.
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   SITE_URL     e.g. https://daily.ruro.in
#   CRON_SECRET  same value as CRON_SECRET in Vercel's environment variables
name: Scrape news

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger scrape
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          curl --fail-with-body --max-time 320 -sS \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/scrape" | head -c 2000
